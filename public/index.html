<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b12">
<title>MeuTube</title>
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://i.ytimg.com">
<link rel="preconnect" href="https://yt3.googleusercontent.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="loadbar" id="loadbar" aria-hidden="true"></div>
<div class="aurora" aria-hidden="true"><span></span><span></span><span></span></div>

<header class="masthead">
  <div class="mh-start">
    <button class="icon-btn rpl" data-menu aria-label="Menu" aria-controls="guide">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 6h18M3 12h12M3 18h18"/></svg>
    </button>
    <a class="logo" href="#/" aria-label="MeuTube, início" data-logo></a>
  </div>
  <form class="search" id="search" role="search">
    <div class="search-box">
      <svg class="lead" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7.5"/><path d="m21 21-4.3-4.3"/></svg>
      <label for="q" class="sr-only">Pesquisar</label>
      <input id="q" type="search" placeholder="Pesquisar vídeos e canais" autocomplete="off" enterkeyhint="search">
    </div>
    <button class="search-btn rpl" aria-label="Pesquisar" title="Pesquisar">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7.5"/><path d="m21 21-4.3-4.3"/></svg>
    </button>
  </form>
  <div class="mh-end">
    <button class="icon-btn rpl ai-top" data-ai aria-label="IA: perguntar e pedir coisas ao Codex" title="IA (Codex)" aria-pressed="false">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.9 5.8L20 11l-6.1 2.2L12 19l-1.9-5.8L4 11l6.1-2.2z"/></svg>
    </button>
    <span class="noads" title="Nenhum anúncio é carregado"><i></i>Sem anúncios</span>
    <a class="icon-btn rpl me" href="#/account" aria-label="Conta do YouTube" title="Conta do YouTube">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
      <span class="me-dot" aria-hidden="true"></span>
    </a>
  </div>
</header>

<nav class="guide" id="guide" aria-label="Menu principal"></nav>
<nav class="mini-guide" id="mini" aria-label="Atalhos"></nav>
<div class="scrim" data-scrim></div>

<main id="app" tabindex="-1"></main>

<aside class="ai-drawer" id="ai-drawer" hidden aria-label="IA"></aside>
<div class="minibar" id="minibar" hidden aria-label="Tocando agora"></div>
<nav class="bottom" id="bottom" aria-label="Principal"></nav>
<button class="to-top rpl" id="to-top" aria-label="Voltar ao topo">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m18 15-6-6-6 6"/></svg>
</button>
<div class="dock" id="dock" aria-live="polite" aria-label="Downloads"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script type="module" src="/app.js"></script>
</body>
</html>
